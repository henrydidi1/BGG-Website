<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0844;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="#0B0C10"/>
  
  <!-- Border gradient effect (simulated) -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.6"/>
  
  <!-- Inner glow -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="none" stroke="url(#grad1)" stroke-width="6" opacity="0.15" filter="url(#glow)"/>
  
  <!-- BG Text -->
  <text x="50" y="62" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="url(#grad1)">BG</text>
</svg>
